[project]
name = "quantype"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Theo Keane", email = "20931519+theochemtheo@users.noreply.github.com" }]
dependencies = []

[project.scripts]
quantype = "quantype:main"

[dependency-groups]
dev = [
  "prek>=0.5.4",
  "pytest>=9.1.1",
  "pytest-sugar>=1.1.1",
  "ruff>=0.16.9",
  "rust-just>=1.58.0",
  "tombi>=1.5.8",
]

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "D",
  "COM812",
  "ISC001",
  "CPY001",
  "TRY003",
  "EM101",
  "EM102",
]
flake8-tidy-imports = { "ban-relative-imports" = "all" }
