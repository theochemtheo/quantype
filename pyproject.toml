[project]
name = "quantype"
version = "0.1.0"
description = "Typed physical quantities for scientific Python and differentiable models"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Theo Keane", email = "20931519+theochemtheo@users.noreply.github.com" }]
dependencies = [
  "jax>=0.11.2",
  "numpy>=2.5.3",
  "pydantic>=2.12",
  "torch>=2.14.0",
]

[dependency-groups]
dev = [
  "mypy>=2.3.1",
  "prek>=0.5.4",
  "pyrefly>=1.3.2",
  "pyright>=1.1.414",
  "pytest>=9.1.1",
  "pytest-sugar>=1.1.1",
  "pytest-xdist>=3.8.0",
  "ruff>=0.16.9",
  "rust-just>=1.58.0",
  "tombi>=1.5.8",
  "ty>=0.0.84",
]

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[tool.mypy]
python_version = "3.12"
files = [
  "src",
  "tests/runtime",
  "tests/typing/positive",
]
strict = true
extra_checks = true
warn_unused_configs = true
pretty = true

[tool.pyrefly]
python-version = "3.12"
preset = "strict"
use-ignore-files = false
ignore-errors-in-generated-code = false
project-includes = [
  "src",
  "tests/runtime",
  "tests/typing/positive",
]
search-path = ["src"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = [
  "src",
  "tests/runtime",
  "tests/typing/positive",
]

[tool.ruff]
target-version = "py312"
respect-gitignore = false

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "D",
  "COM812",
  "ISC001",
  "CPY001",
  "TRY003",
  "EM101",
  "EM102",
]
flake8-tidy-imports = { "ban-relative-imports" = "all" }

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "INP001"]
"scripts/check_typing.py" = ["INP001", "T201"]
# Numerical dispatch is deliberately dynamic and backend imports stay lazy.
"src/quantype/core.py" = ["ANN401", "PLC0415", "SLF001"]
"src/quantype/core.pyi" = ["ANN401"]
"src/quantype/_math.py" = ["ANN401", "PLC0415"]

[tool.ty.environment]
python-version = "3.12"
root = ["./src"]

[tool.ty.src]
respect-ignore-files = false
include = [
  "src",
  "tests/runtime",
  "tests/typing/positive",
]

[tool.ty.analysis]
strict-equality-semantics = true

[tool.ty.rules]
all = "error"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu" },
]
