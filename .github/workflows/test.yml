name: test

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.12.17"
          cache-suffix: all-extras
          save-cache: false
      - run: uv sync --locked --all-extras
      - run: uv run just check-generated lint
      - run: uv build

  typecheck:
    name: ${{ matrix.recipe }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        recipe: [typecheck, stubcheck]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.12.17"
          cache-suffix: all-extras
          save-cache: false
      - run: uv sync --locked --all-extras
      - run: uv run just "$RECIPE"
        env:
          RECIPE: ${{ matrix.recipe }}

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.12.17"
          cache-suffix: all-extras
          save-cache: ${{ github.ref == 'refs/heads/main' }}
      - run: uv sync --locked --all-extras
      - run: bash scripts/coverage.sh
        env:
          QUANTYPE_TEST_TIER: full
      - run: cat coverage/summary.md >> "$GITHUB_STEP_SUMMARY"
        if: always()
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: coverage-html
          path: htmlcov/
      - name: Comment coverage on PR
        if: ${{ always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment "${{ github.event.pull_request.number }}" --edit-last --create-if-none --body-file coverage/summary.md
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: coverage-badge
          path: coverage/badge.json

  coverage-badge:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: coverage
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-badge
          path: badges
      - working-directory: badges
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mv badge.json coverage.json
          git init -q -b badges
          git add coverage.json
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Update coverage badge"
          git push -fq "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" badges

  python-versions:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.12.17"
          cache-suffix: all-extras-${{ matrix.python }}
          save-cache: ${{ github.ref == 'refs/heads/main' }}
      - run: uv sync --locked --all-extras --python ${{ matrix.python }}
      - run: uv run --python ${{ matrix.python }} just test
        env:
          QUANTYPE_TEST_TIER: full

  tiers:
    name: tiers (${{ matrix.tier }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - tier: base
            sync: ""
          - tier: jax
            sync: "--extra jax"
          - tier: torch
            sync: "--extra torch"
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.12.17"
          cache-suffix: tier-${{ matrix.tier }}
          save-cache: ${{ github.ref == 'refs/heads/main' }}
      - run: uv sync --locked --no-default-groups --group test $SYNC_ARGS
        env:
          SYNC_ARGS: ${{ matrix.sync }}
      - run: uv run --no-sync pytest tests/runtime
        env:
          QUANTYPE_TEST_TIER: ${{ matrix.tier }}

  minimum-core:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.12.17"
          cache-suffix: minimum-core
          save-cache: ${{ github.ref == 'refs/heads/main' }}
      - run: uv venv --python 3.12
      - run: uv pip install . --group test 'numpy==2.0.0' 'pydantic==2.0.3'
      - run: uv run --no-sync pytest tests/runtime
        env:
          QUANTYPE_TEST_TIER: base

  test-gate:
    needs:
      - lint
      - typecheck
      - coverage
      - coverage-badge
      - python-versions
      - tiers
      - minimum-core
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every test job to pass or be skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "test job results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success | skipped) ;;
              *)
                echo "::error::a test job did not pass ($result)"
                exit 1
                ;;
            esac
          done
