name: release

on:
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.12.17"
          # A release build must not reuse a cache another ref could have written.
          enable-cache: false
      - name: Check the tag matches the project version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(uv version --short)
          if [ "v$version" != "$TAG" ]; then
            echo "::error::tag $TAG does not match project version $version"
            exit 1
          fi
      - run: uv build
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: dist
          path: dist

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [build]
    environment: pypi
    permissions:
      # Trusted publishing (OIDC) and artifact attestation
      id-token: write
      contents: write
      attestations: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: dist
          path: dist
      - name: Generate artifact attestation
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-path: "dist/*"
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.12.17"
          # This job only runs `uv publish`, which installs nothing, so there
          # is nothing to cache against.
          enable-cache: false
      - name: Publish to PyPI
        run: uv publish --trusted-publishing always dist/*
      - name: Create GitHub Release
        # Notes come from the tag's CHANGELOG section; the built wheel and
        # sdist are attached. Runs after the PyPI publish, so a release only
        # appears once the artifacts are live. Tagging is the only manual step.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/changelog-section.sh "${GITHUB_REF_NAME#v}" > release-notes.md
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            dist/*
