name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  prototype:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.12.17"
          enable-cache: true
      - run: uv sync --locked --all-extras
      - run: uv run just check-generated
      - run: uv run just lint
      - run: uv run just typecheck
      - run: uv run just test
      - run: uv build

  # The classifiers promise these versions; the full suite, with every
  # backend, runs on each of them.
  python-versions:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.12.17"
          enable-cache: true
      - run: uv sync --locked --all-extras --python ${{ matrix.python }}
      - run: uv run --python ${{ matrix.python }} just test

  optional-dependencies:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        extras: ["", "--extra jax", "--extra torch"]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.12.17"
      - run: uv sync --locked --no-dev ${{ matrix.extras }}
      - run: uv pip install pytest
      - run: uv run --no-sync pytest tests/runtime

  minimum-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.12.17"
      - run: uv venv --python 3.12
      - run: uv pip install . 'numpy==2.0.0' 'scipy==1.13.0' 'pydantic==2.0.3' pytest
      - run: uv run --no-sync pytest tests/runtime
