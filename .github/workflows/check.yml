name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  prototype:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.12.17"
          enable-cache: true
      - run: uv sync --locked --all-extras
      - run: uv run just check-generated
      - run: uv run just lint
      - run: uv run just typecheck
      - run: uv run just stubcheck
      - run: uv run just test
        env:
          QUANTYPE_TEST_TIER: full
      - run: uv build

  # The classifiers promise these versions; the full suite, with every
  # backend, runs on each of them.
  python-versions:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.12.17"
          enable-cache: true
      - run: uv sync --locked --all-extras --python ${{ matrix.python }}
      - run: uv run --python ${{ matrix.python }} just test
        env:
          QUANTYPE_TEST_TIER: full

  # Deliberately incomplete environments: the `test` group plus at most one
  # backend, from the lockfile. Import guards and skips only run when a backend
  # is genuinely missing, which never happens with everything installed; the
  # tier canary in test_optional_backends.py fails if a tier drifts.
  tiers:
    name: tiers (${{ matrix.tier }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - tier: base
            sync: ""
          - tier: jax
            sync: "--extra jax"
          - tier: torch
            sync: "--extra torch"
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.12.17"
      - run: uv sync --locked --no-default-groups --group test $SYNC_ARGS
        env:
          SYNC_ARGS: ${{ matrix.sync }}
      - run: uv run --no-sync pytest tests/runtime
        env:
          QUANTYPE_TEST_TIER: ${{ matrix.tier }}

  # The oldest supported runtime dependencies, resolved outside the lockfile.
  minimum-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.12.17"
      - run: uv venv --python 3.12
      - run: uv pip install . --group test 'numpy==2.0.0' 'pydantic==2.0.3'
      - run: uv run --no-sync pytest tests/runtime
        env:
          QUANTYPE_TEST_TIER: base

  coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.12.17"
          enable-cache: true
      # The full dependency set, deliberately: the floor in scripts/coverage.sh
      # is calibrated against a run where every backend and checker is present.
      # The tiers do not contribute, because a partial run is not a coverage
      # figure; QUANTYPE_TEST_TIER=full makes an incomplete environment fail.
      - run: uv sync --locked --all-extras
      - run: bash scripts/coverage.sh
        env:
          QUANTYPE_TEST_TIER: full
      - run: cat coverage/summary.md >> "$GITHUB_STEP_SUMMARY"
        if: always()
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: coverage-html
          path: htmlcov/
      - name: Comment coverage on PR
        if: ${{ always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment "${{ github.event.pull_request.number }}" --edit-last --create-if-none --body-file coverage/summary.md
