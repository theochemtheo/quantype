name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  prototype:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
      - run: uv sync --locked --all-extras
      - run: uv run just check-generated
      - run: uv run just lint
      - run: uv run just typecheck
      - run: uv run just test
      - run: uv build

  optional-dependencies:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        extras: ["", "--extra jax", "--extra torch"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - run: uv sync --locked --no-dev ${{ matrix.extras }}
      - run: uv pip install pytest
      - run: uv run --no-sync pytest tests/runtime

  minimum-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - run: uv venv --python 3.12
      - run: uv pip install . 'numpy==2.0.0' 'scipy==1.13.0' 'pydantic==2.0.3' pytest
      - run: uv run --no-sync pytest tests/runtime
