name: pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.13.0"
          cache-suffix: docs-all-extras
          save-cache: true
      - run: uv sync --locked --all-extras --group docs
      - name: Check generated sources and production documentation
        run: uv run --all-extras just check-generated docs-check
        env:
          QUANTYPE_TEST_TIER: full
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: vars.QUANTYPE_PAGES_ENABLED == 'true'
        with:
          name: github-pages-${{ github.sha }}
          path: site/

  deploy:
    if: vars.QUANTYPE_PAGES_ENABLED == 'true' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deployment
        with:
          artifact_name: github-pages-${{ github.sha }}
